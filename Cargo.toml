[workspace]
resolver = "3"
members = [
    "crates/openmeet-core",
    "crates/openmeet-intel",
    "crates/openmeet-engine",
    "crates/openmeet-providers",
    "crates/openmeet-platform",
    "crates/openmeet-store",
    # "src-tauri" is added once the app crate exists
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["OpenMeet contributors"]

[workspace.dependencies]
openmeet-core = { path = "crates/openmeet-core" }
openmeet-intel = { path = "crates/openmeet-intel" }
openmeet-engine = { path = "crates/openmeet-engine" }
openmeet-providers = { path = "crates/openmeet-providers" }
openmeet-platform = { path = "crates/openmeet-platform" }
openmeet-store = { path = "crates/openmeet-store" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1.26", features = ["v4", "v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
parking_lot = "0.12"
regex = "1"
base64 = "0.23"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "debuginfo"
panic = "unwind"

# Keep dev builds of the DSP / image hot paths reasonably fast.
[profile.dev.package."*"]
opt-level = 2
