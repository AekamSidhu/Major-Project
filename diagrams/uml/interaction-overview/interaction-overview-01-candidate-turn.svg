on check</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="319.1045" x="441.2036" y="528.4087">(sequence-04-semantic-question-check)</text><polygon fill="#FFF8E1" points="481.0283,372.1875,720.4834,372.1875,738.4834,399.1289,720.4834,426.0703,481.0283,426.0703,463.0283,399.1289,481.0283,372.1875" style="stroke:#C9A227;stroke-width:0.75;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="23.614" x="609.7559" y="446.8755">yes</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="233.4551" x="484.0283" y="394.6113">heuristic says ambiguous and</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="201.2959" x="484.0283" y="418.5527">semantic detection is on?</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="19.0056" x="741.4834" y="391.9878">no</text><polygon fill="#FFF8E1" points="600.7559,580.9263,618.7559,598.9263,600.7559,616.9263,582.7559,598.9263,600.7559,580.9263" style="stroke:#C9A227;stroke-width:0.75;"/><polygon fill="#FFF8E1" points="475.6055,646.9263,725.9063,646.9263,743.9063,664.9263,725.9063,682.9263,475.6055,682.9263,457.6055,664.9263,475.6055,646.9263" style="stroke:#C9A227;stroke-width:0.75;"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="244.3008" x="478.6055" y="672.3794">interviewer question detected?</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="23.614" x="430.9915" y="657.7852">yes</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="153.9382" x="746.9063" y="657.7852">no: candidate speech</text><rect fill="#F6F7FD" height="131.7656" rx="6" ry="6" style="stroke:#4F5BD5;stroke-width:0.75;" width="402.6445" x="190.5601" y="697.9263"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="254.9795" x="208.5601" y="735.3501">[ref] Integrity: reference answers</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="257.1416" x="208.5601" y="759.2915">and previous answer's last check</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="299.6191" x="208.5601" y="783.2329">(sequence-01-answer-integrity-check,</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="366.6445" x="208.5601" y="807.1743">"When the interviewer's question is detected")</text><rect fill="#F6F7FD" height="59.9414" rx="6" ry="6" style="stroke:#4F5BD5;stroke-width:0.75;" width="372.8496" x="623.2046" y="697.9263"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="336.8496" x="641.2046" y="735.3501">candidate utterance joins the open answer</text><rect fill="#F6F7FD" height="83.8828" rx="6" ry="6" style="stroke:#4F5BD5;stroke-width:0.75;" width="340.998" x="639.1304" y="810.3677"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="304.998" x="657.1304" y="847.7915">arm turn-end timer and integrity timer</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="173.0303" x="657.1304" y="871.7329">(turn_end_silence_ms)</text><polygon fill="#FFF8E1" points="600.7559,909.2505,618.7559,927.2505,600.7559,945.2505,582.7559,927.2505,600.7559,909.2505" style="stroke:#C9A227;stroke-width:0.75;"/><rect fill="#555555" height="9" rx="3.75" ry="3.75" style="stroke:#555555;stroke-width:1.5;" width="1094.1094" x="53.7012" y="975.2505"/><rect fill="#F6F7FD" height="83.8828" rx="6" ry="6" style="stroke:#4F5BD5;stroke-width:0.75;" width="337.1484" x="71.7012" y="1050.1626"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="277.752" x="8