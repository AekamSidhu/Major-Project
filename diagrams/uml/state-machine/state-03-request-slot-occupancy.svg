<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="819px" preserveAspectRatio="none" style="width:2304px;height:819px;background:#FFFFFF;" version="1.1" viewBox="0 0 2304 819" width="2304px" zoomAndPan="magnify"><title>Request slots - RequestManager.current pointer per exclusive RequestSlot (Primary, Followups)</title><defs/><g><text fill="#000000" font-family="Segoe UI" font-size="24" font-weight="bold" lengthAdjust="spacing" textLength="1077.3867" x="602.8066" y="43.8984">Request slots - RequestManager.current pointer per exclusive RequestSlot (Primary, Followups)</text><!--cluster Occupied--><g id="cluster_Occupied"><path d="M481.71,327.4219 L2287.5,327.4219 A6,6 0 0 1 2293.5,333.4219 L2293.5,364.8633 L475.71,364.8633 L475.71,333.4219 A6,6 0 0 1 481.71,327.4219 " fill="#F6F7FD" style="stroke:#F6F7FD;stroke-width:1.5;"/><rect fill="none" height="343.5" rx="6" ry="6" style="stroke:#4F5BD5;stroke-width:0.75;" width="1817.79" x="475.71" y="327.4219"/><line style="stroke:#4F5BD5;stroke-width:0.75;" x1="475.71" x2="2293.5" y1="364.8633" y2="364.8633"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="259.6377" x="1254.7862" y="355.8457">Occupied: Slots.current[slot] = id</text></g><g id="Occupied.Running"><rect fill="#F6F7FD" height="161.707" rx="6" ry="6" style="stroke:#4F5BD5;stroke-width:0.75;" width="403.0225" x="1209" y="435.4219"/><line style="stroke:#4F5BD5;stroke-width:0.75;" x1="1209" x2="1612.0225" y1="504.3047" y2="504.3047"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="131.0098" x="1304.8403" y="465.3457">Request running</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="211.3418" x="1304.8403" y="489.2871">(AnswerState not terminal)</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="184.4121" x="1219.5" y="534.2285">is_current(ticket) = true</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="367.0225" x="1219.5" y="558.1699">emit_if_current: AnswerDelta, FollowupsReady,</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="213.1436" x="1219.5" y="582.1113">AnswerComplete delivered</text></g><g id="Occupied.Finished"><rect fill="#F6F7FD" height="137.7656" rx="6" ry="6" style="stroke:#4F5BD5;stroke-width:0.75;" width="281.3027" x="1975.5" y="448.9219"/><line style="stroke:#4F5BD5;stroke-width:0.75;" x1="1975.5" x2="2256.8027" y1="517.8047" y2="517.8047"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="131.4229" x="1993.5" y="478.8457">Request finished</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="245.3027" x="1993.5" y="502.7871">(Complete / Failed / Cancelled)</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="235.8105" x="1986" y="547.7285">pointer kept, so late events of</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="244.7666" x="1986" y="571.6699">older requests stay suppressed</text></g><rect fill="#F6F7FD" height="68.8828" rx="6" ry="6" style="stroke:#4F5BD5;stroke-width:0.75;" width="215.502" x="380.25" y="706.9219"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="150.1963" x="390.75" y="736.8457">No current request</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="194.502" x="390.75" y="760.7871">(slot not in Slots.current)</text><ellipse cx="24" cy="741.4219" fill="#222222" rx="15" ry="15" style="stroke:#222222;stroke-width:1.5;"/><g id="elem_GMN2"><path d="M130.5,84.4219 L130.5,284.9531 A6,6 0 0 0 136.5,290.9531 L839.6895,290.9531 A6,6 0 0 0 845.6895,284.9531 L845.6895,93.4219 L830.6895,78.4219 L136.5,78.4219 A6,6 0 0 0 130.5,84.4219 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:0.75;"/><path d="M830.6895,78.4219 L830.6895,90.4219 A3,3 0 0 0 833.6895,93.4219 L845.6895,93.4219 L830.6895,78.4219 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:1.5;"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="198.7734" x="142.5" y="108.3457">Slot use (begin call sites):</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="677.6895" x="142.5" y="132.2871">Primary   - CandidateAnswer, AskAi, Refinement, Clarification, CatchUp (start_primary)</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="264.9111" x="142.5" y="156.2285">Followups - InterviewerFollowups</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="593.3936" x="142.5" y="180.1699">Background (never exclusive, not tracked in Slots.current; cancelled only by</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="516.1289" x="142.5" y="204.1113">cancel_all(true) / cancel(id)): QuestionClassification, Compression,</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="320.1504" x="142.5" y="228.0527">TopicAnalysis, Summary, ScreenAnalysis.</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="529.1191" x="142.5" y="251.9941">The finished entry of a request that is no longer current is dropped</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="490.1221" x="142.5" y="275.9355">from Slots.entries; the current one is kept until the next begin.</text></g><!--link Running to Finished--><g id="link_Running_Finished"><path d="M1612.695,578.9269 C1627.755,582.1219 1642.8,584.8519 1657.5,586.9219 C1777.65,603.8569 1811.1,608.5219 1930.5,586.9219 C1945.305,584.2519 1951.8439,583.024 1966.8139,578.569 " fill="none" id="Running-to-Finished" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="1975.44,576.0019,1960.7894,574.1018,1968.2516,578.1411,1964.2122,585.6033,1975.44,576.0019" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="133.1279" x="1727.9293" y="556.7271">set_state(terminal)</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="203.4866" x="1692.75" y="578.6733">/ emit AnswerStateChanged</text></g><!--link Running to Finished--><g id="link_Running_Finished"><path d="M1612.695,516.8569 C1728.51,517.0969 1862.355,517.3937 1966.065,517.6037 " fill="none" id="Running-to-Finished-1" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="1975.065,517.6219,1961.5772,511.5946,1967.565,517.6067,1961.5529,523.5945,1975.065,517.6219" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="130.7593" x="1729.0756" y="466.7271">cancel(request_id)</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="264.9104" x="1662" y="488.6733">(cancel_request, dismiss_suggestion)</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="105.8723" x="1741.519" y="510.6196">or cancel_all(..)</text></g><!--link *start* to Empty--><g id="link_*start*_Empty"><path d="M39.3,741.4219 C89.295,741.4219 255,741.4219 370.74,741.4219 " fill="none" id="*start*-to-Empty" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="379.74,741.4219,366.24,735.4219,372.24,741.4219,366.24,747.4219,379.74,741.4219" style="stroke:#3E4756;stroke-width:1.5;"/></g><!--link Empty to Running--><g id="link_Empty_Running"><path d="M596.265,762.8719 C732.9,785.4469 974.835,808.5619 1164,735.4219 C1236.15,707.5369 1294.622,654.5169 1339.352,604.4769 " fill="none" id="Empty-to-Running" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="1345.35,597.7669,1331.8797,603.8332,1340.3517,603.3586,1340.8264,611.8305,1345.35,597.7669" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="116.9421" x="969.3248" y="705.2271">begin(slot, kind)</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="153.5918" x="951" y="727.1733">/ emit AnswerStarted</text></g><!--link Occupied to Running--><g id="link_Occupied_Running"><path d="M489.915,427.9369 C499.755,428.8819 932.0364,470.4999 1199.5614,496.2399 " fill="none" id="Occupied-to-Running" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="1208.52,497.1019,1195.6567,489.8365,1201.0545,496.3836,1194.5074,501.7814,1208.52,497.1019" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="238.533" x="908.5638" y="415.7271">begin(slot, kind) / previous ticket</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="206.395" x="924.6328" y="437.6733">cancelled -&gt; Cancelled, then</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="264.6606" x="895.5" y="459.6196">emit AnswerStarted (under slot lock)</text></g><!--link Occupied to GMN2--><g id="link_Occupied_GMN2"><path d="M488.25,327.1552 C488.25,326.9792 488.25,326.8031 488.25,326.6271 C488.25,326.275 488.25,325.9229 488.25,325.5708 C488.25,314.3034 488.25,303.0356 488.25,291.7669 " fill="none" id="Occupied-GMN2" style="stroke:#3E4756;stroke-width:1.5;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[XLNRZjis47tNLqpp4hcGPQIF3bfWk-a2GP5UrkrJ71XSQMmFJ94gIMsY1Fdt7b8NAniW0IpR98SpP-QS6VqWfj9TpLIM6tmEFlIQI-aQdJsdL-paaMiwE