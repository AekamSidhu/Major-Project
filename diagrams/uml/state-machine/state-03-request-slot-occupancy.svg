<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="813px" preserveAspectRatio="none" style="width:2227px;height:813px;background:#FFFFFF;" version="1.1" viewBox="0 0 2227 813" width="2227.5px" zoomAndPan="magnify"><title>Request slots - RequestManager.current pointer per exclusive RequestSlot (Primary, Followups)</title><defs/><g><text fill="#000000" font-family="Segoe UI" font-size="24" font-weight="bold" lengthAdjust="spacing" textLength="1077.3867" x="564.5566" y="43.8984">Request slots - RequestManager.current pointer per exclusive RequestSlot (Primary, Followups)</text><!--cluster Occupied--><g id="cluster_Occupied"><path d="M443.46,327.4219 L2211,327.4219 A6,6 0 0 1 2217,333.4219 L2217,364.8633 L437.46,364.8633 L437.46,333.4219 A6,6 0 0 1 443.46,327.4219 " fill="#F6F7FD" style="stroke:#F6F7FD;stroke-width:1.5;"/><rect fill="none" height="343.5" rx="6" ry="6" style="stroke:#4F5BD5;stroke-width:0.75;" width="1779.54" x="437.46" y="327.4219"/><line style="stroke:#4F5BD5;stroke-width:0.75;" x1="437.46" x2="2217" y1="364.8633" y2="364.8633"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="259.6377" x="1197.4112" y="355.8457">Occupied: Slots.current[slot] = id</text></g><g id="Occupied.Running"><rect fill="#F6F7FD" height="161.707" rx="6" ry="6" style="stroke:#4F5BD5;stroke-width:0.75;" width="403.0225" x="1132.5" y="435.4219"/><line style="stroke:#4F5BD5;stroke-width:0.75;" x1="1132.5" x2="1535.5225" y1="504.3047" y2="504.3047"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="131.0098" x="1228.3403" y="465.3457">Request running</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="211.3418" x="1228.3403" y="489.2871">(AnswerState not terminal)</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="184.4121" x="1143" y="534.2285">is_current(ticket) = true</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="367.0225" x="1143" y="558.1699">emit_if_current: AnswerDelta, FollowupsReady,</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="213.1436" x="1143" y="582.1113">AnswerComplete delivered</text></g><g id="Occupied.Finished"><rect fill="#F6F7FD" height="137.7656" rx="6" ry="6" style="stroke:#4F5BD5;stroke-width:0.75;" width="281.3027" x="1899" y="448.9219"/><line style="stroke:#4F5BD5;stroke-width:0.75;" x1="1899" x2="2180.3027" y1="517.8047" y2="517.8047"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="131.4229" x="1917" y="478.8457">Request finished</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="245.3027" x="1917" y="502.7871">(Complete / Failed / Cancelled)</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="235.8105" x="1909.5" y="547.7285">pointer kept, so late events of</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="244.7666" x="1909.5" y="571.6699">older requests stay suppressed</text></g><rect fill="#F6F7FD" height="68.8828" rx="6" ry="6" style="stroke:#4F5BD5;stroke-width:0.75;" width="215.502" x="342" y="706.9219"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="150.1963" x="352.5" y="736.8457">No current request</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="194.502" x="352.5" y="760.7871">(slot not in Slots.current)</text><ellipse cx="24" cy="741.4219" fill="#222222" rx="15" ry="15" style="stroke:#222222;stroke-width:1.5;"/><g id="elem_GMN2"><path d="M130.5,84.4219 L130.5,284.9531 A6,6 0 0 0 136.5,290.9531 L763.0049,290.9531 A6,6 0 0 0 769.0049,284.9531 L769.0049,93.4219 L754.0049,78.4219 L136.5,78.4219 A6,6 0 0 0 130.5,84.4219 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:0.75;"/><path d="M754.0049,78.4219 L754.0049,90.4219 A3,3 0 0 0 757.0049,93.4219 L769.0049,93.4219 L754.0049,78.4219 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:1.5;"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="198.7734" x="142.5" y="108.3457">Slot use (begin call sites):</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="601.0049" x="142.5" y="132.2871">Primary   - CandidateAnswer, AskAi, Refinement, Clarification (start_primary)</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="264.9111" x="142.5" y="156.2285">Followups - InterviewerFollowups</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="593.3936" x="142.5" y="180.1699">Background (never exclusive, not tracked in Slots.current; cancelled only by</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="516.1289" x="142.5" y="204.1113">cancel_all(true) / cancel(id)): QuestionClassification, Compression,</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="320.1504" x="142.5" y="228.0527">TopicAnalysis, Summary, ScreenAnalysis.</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="529.1191" x="142.5" y="251.9941">The finished entry of a request that is no longer current is dropped</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="490.1221" x="142.5" y="275.9355">from Slots.entries; the current one is kept until the next begin.</text></g><!--link Running to Finished--><g id="link_Running_Finished"><path d="M1536.195,578.9269 C1551.255,582.1069 1566.3,584.8519 1581,586.9219 C1701.15,603.8419 1734.6,608.5219 1854,586.9219 C1868.805,584.2369 1875.3415,583.001 1890.3115,578.561 " fill="none" id="Running-to-Finished" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="1898.94,576.0019,1884.2912,574.0883,1891.7496,578.1345,1887.7034,585.5929,1898.94,576.0019" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="133.1279" x="1651.4293" y="556.7271">set_state(terminal)</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="203.4866" x="1616.25" y="578.6733">/ emit AnswerStateChanged</text></g><!--link Running to Finished--><g id="link_Running_Finished"><path d="M1536.195,516.8419 C1652.01,517.0969 1785.855,517.3773 1889.565,517.6023 " fill="none" id="Running-to-Finished-1" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="1898.565,517.6219,1885.078,511.5926,1891.065,517.6056,1885.052,523.5926,1898.565,517.6219" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="130.7593" x="1652.5756" y="466.7271">cancel(request_id)</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="264.9104" x="1585.5" y="488.6733">(cancel_request, dismiss_suggestion)</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="105.8723" x="1665.019" y="510.6196">or cancel_all(..)</text></g><!--link *start* to Empty--><g id="link_*start*_Empty"><path d="M39.09,741.4219 C84.915,741.4219 227.685,741.4219 332.97,741.4219 " fill="none" id="*start*-to-Empty" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="341.97,741.4219,328.47,735.4219,334.47,741.4219,328.47,747.4219,341.97,741.4219" style="stroke:#3E4756;stroke-width:1.5;"/></g><!--link Empty to Running--><g id="link_Empty_Running"><path d="M558.18,762.5869 C688.095,783.4669 911.91,803.3569 1087.5,735.4219 C1159.635,707.5069 1218.1231,654.5029 1262.8381,604.4629 " fill="none" id="Empty-to-Running" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="1268.835,597.7519,1255.3657,603.8205,1263.8376,603.3444,1264.3137,611.8163,1268.835,597.7519" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="116.9421" x="892.8248" y="705.2271">begin(slot, kind)</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="153.5918" x="874.5" y="727.1733">/ emit AnswerStarted</text></g><!--link Occupied to Running--><g id="link_Occupied_Running"><path d="M451.665,427.9369 C460.995,428.8669 866.16,469.5627 1123.26,495.3777 " fill="none" id="Occupied-to-Running" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="1132.215,496.2769,1119.382,488.9582,1124.7525,495.5276,1118.1831,500.8981,1132.215,496.2769" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="238.533" x="832.0638" y="415.7271">begin(slot, kind) / previous ticket</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="206.395" x="848.1328" y="437.6733">cancelled -&gt; Cancelled, then</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="264.6606" x="819" y="459.6196">emit AnswerStarted (under slot lock)</text></g><!--link Occupied to GMN2--><g id="link_Occupied_GMN2"><path d="M450,327.1488 C450,326.9728 450,326.7967 450,326.6207 C450,326.2686 450,325.9165 450,325.5645 C450,314.2978 450,303.0319 450,291.7669 " fill="none" id="Occupied-GMN2" style="stroke:#3E4756;stroke-width:1.5;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[XLNRZjis47tNLqppKgcGPJIF3XfWi-a2GT2cNVSj3WokDBO7faYLf3PHW_nx3wcBdGsG06jxHSxbp9mpev_4rBflcAfgZR-z3uFcIlfMPp_JQtRoo0qTd6qtL3iLsAzjnwPb3glQEbvxLw_3qB6ldAVydl_jsOUjjg6awU6