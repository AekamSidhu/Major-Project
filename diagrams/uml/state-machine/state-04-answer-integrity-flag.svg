.07,1759.9219 L651.105,1759.9219 A6,6 0 0 0 645.105,1765.9219 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:0.75;"/><path d="M982.9654,1759.9219 L982.9654,1771.9219 A3,3 0 0 0 985.9654,1774.9219 L997.9654,1774.9219 L982.9654,1759.9219 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:0.75;"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="315.3604" x="657.105" y="1789.8457">The flag row in integrity_flags keeps the</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="280.96" x="657.105" y="1813.7871">last stored revision (replaced by id).</text></g><!--link *start* to Collecting--><g id="link_*start*_Collecting"><path d="M170.145,151.4419 C160.935,179.3569 143.625,246.1069 170.355,291.4219 C198.87,339.7519 237.549,371.7329 286.719,398.6279 " fill="none" id="*start*-to-Collecting" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="294.615,402.9469,285.6503,391.2045,288.035,399.3478,279.8917,401.7324,294.615,402.9469" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="176.7949" x="252.0537" y="261.2271">first candidate utterance</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="331.1924" x="174.855" y="283.1733">(on_candidate_segment creates OpenAnswer)</text></g><!--link Collecting to Pausing--><g id="link_Collecting_Pausing"><path d="M483.51,611.1919 C474.84,645.6169 460.965,680.6569 438.855,708.4219 C425.07,725.7319 415.3372,735.5589 396.7072,748.3089 " fill="none" id="Collecting-to-Pausing" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="389.28,753.3919,403.8094,750.7188,395.4693,749.156,397.0321,740.8159,389.28,753.3919" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="104.2771" x="515.4616" 