x="323.355" y="580.6699">on each speech start (old timer outdated)</text></g><!--link *start*Collecting to Speaking--><g id="link_*start*Collecting_Speaking"><path d="M499.605,427.9983 C499.605,441.1383 499.605,452.8833 499.605,472.8033 " fill="none" id="*start*Collecting-to-Speaking" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="499.605,481.8033,505.605,468.3033,499.605,474.3033,493.605,468.3033,499.605,481.8033" style="stroke:#3E4756;stroke-width:1.5;"/></g><g id="Pausing"><rect fill="#F6F7FD" height="137.7656" rx="6" ry="6" style="stroke:#4F5BD5;stroke-width:0.75;" width="345.1289" x="45.855" y="753.4219"/><line style="stroke:#4F5BD5;stroke-width:0.75;" x1="45.855" x2="390.9839" y1="798.3633" y2="798.3633"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="62.209" x="187.315" y="783.3457">Pausing</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="172.5557" x="56.355" y="828.2871">turn-end timer armed</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="309.1289" x="56.355" y="852.2285">(turn_end_silence_ms, default 1500 ms)</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="239.6865" x="56.355" y="876.1699">fires only for the latest version</text></g><g id="Checking"><rect fill="#F6F7FD" height="137.7656" rx="6" ry="6" style="stroke:#4F5BD5;stroke-width:0.75;" width="315.1055" x="74.355" y="1054.9219"/><line style="stroke:#4F5BD5;stroke-width:0.75;" x1="74.355" x2="389.4605" y1="1099.8633" y2="1099.8633"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="165.4453" x="149.1851" y="1084.8457">Checking (revision n)</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="279.1055" x="84.855" y="1129.7871">Background request IntegrityCheck</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="205.1104" x="84.855" y="1153.7285">four signals run in parallel</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="215.5518" x="84.855" y="1177.6699">(delivery computed before)</text></g><g id="Checked"><rect fill="#F6F7FD" height="113.8242" rx="6" ry="6" style="stroke:#4F5BD5;stroke-width:0.75;" width="345.6299" x="665.355" y="79.9219"/><line style="stroke:#4F5BD5;stroke-width:0.75;" x1="665.355" x2="1010.9849" y1="124.8633" y2="124.8633"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="160.3125" x="758.0137" y="109.8457">Checked (revision n)</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="176.6074" x="675.855" y="154.7871">flag stored and shown</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="309.6299" x="675.855" y="178.7285">level low / possible / high / unavailable</text></g><g id="Final"><rect fill="#F6F7FD" height="137.7656" rx="6" ry="6" style="stroke:#4F5BD5;stroke-width:0.75;" width="337.4033" x="529.605" y="1530.4219"/><line style="stroke:#4F5BD5;stroke-width:0.75;" x1="529.605" x2="867.0083" y1="1575.3633" y2="1575.3633"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="36.8525" x="679.8804" y="1560.3457">Final</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="247.2363" x="540.105" y="1605.2871">closed answer: last check done;</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="295.6465" x="540.105" y="1629.2285">the answer joins the delivery baseline</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="301.4033" x="540.105" y="1653.1699">(first 3 answers with at least 10 words)</text></g><ellipse cx="17