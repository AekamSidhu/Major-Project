<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="778.5px" preserveAspectRatio="none" style="width:2428px;height:778px;background:#FFFFFF;" version="1.1" viewBox="0 0 2428 778" width="2428.5px" zoomAndPan="magnify"><title>C4 level 1: OpenMeet system context</title><defs/><g><text fill="#000000" font-family="Segoe UI" font-size="24" font-weight="bold" lengthAdjust="spacing" textLength="417.6445" x="995.1138" y="43.8984">C4 level 1: OpenMeet system context</text><!--entity Cand--><g id="elem_Cand"><ellipse cx="159.1274" cy="90.4219" fill="#FFFFFF" rx="12" ry="12" style="stroke:#3E4756;stroke-width:0.75;"/><path d="M159.1274,102.4219 L159.1274,142.9219 M139.6274,114.4219 L178.6274,114.4219 M159.1274,142.9219 L139.6274,165.4219 M159.1274,142.9219 L178.6274,165.4219 " fill="none" style="stroke:#3E4756;stroke-width:0.75;"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="80.7188" x="19.5" y="190.0957">Candidate</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="279.2549" x="19.5" y="214.0371">(answers; uses the desktop overlay)</text></g><!--entity Iv--><g id="elem_Iv"><ellipse cx="651.1216" cy="90.4219" fill="#FFFFFF" rx="12" ry="12" style="stroke:#3E4756;stroke-width:0.75;"/><path d="M651.1216,102.4219 L651.1216,142.9219 M631.6216,114.4219 L670.6216,114.4219 M651.1216,142.9219 L631.6216,165.4219 M651.1216,142.9219 L670.6216,165.4219 " fill="none" style="stroke:#3E4756;stroke-width:0.75;"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="87.8203" x="489.75" y="190.0957">Interviewer</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="322.7432" x="489.75" y="214.0371">(asks; uses the desktop app or the room)</text></g><!--entity Wp--><g id="elem_Wp"><ellipse cx="1264.8721" cy="90.4219" fill="#FFFFFF" rx="12" ry="12" style="stroke:#3E4756;stroke-width:0.75;"/><path d="M1264.8721,102.4219 L1264.8721,142.9219 M1245.3721,114.4219 L1284.3721,114.4219 M1264.8721,142.9219 L1245.3721,165.4219 M1264.8721,142.9219 L1284.3721,165.4219 " fill="none" style="stroke:#3E4756;stroke-width:0.75;"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="115.1104" x="1062.75" y="190.0957">Team member</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="404.2441" x="1062.75" y="214.0371">(workplace meetings: board, catch me up, minutes)</text></g><!--entity OM--><g id="elem_OM"><rect fill="#E6E9FB" height="131.7656" rx="9" ry="9" style="stroke:#4F5BD5;stroke-width:0.75;" width="396.2549" x="843" y="364.1719"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="84.8408" x="861" y="401.5957">OpenMeet</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="138.5508" x="861" y="425.5371">[software system]</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="321.0645" x="861" y="449.4785">Local-first meeting copilot: transcription,</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="360.2549" x="861" y="473.4199">suggestions, follow-ups, answer-integrity flag</text></g><!--entity Meet--><g id="elem_Meet"><rect fill="#FFFFFF" height="131.7656" rx="9" ry="9" style="stroke:#4F5BD5;stroke-width:0.75;" width="488.6982" x="10.5" y="638.6719"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="101.4873" x="28.5" y="676.0957">Meeting app</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="74.0127" x="28.5" y="700.0371">[external]</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="354.4893" x="28.5" y="723.9785">Zoom, Teams, Google Meet, Slack, Discord ...</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="452.6982" x="28.5" y="747.9199">(audio and screen are read locally, never sent by the app)</text></g><!--entity OLLAMA--><g id="elem_OLLAMA"><rect fill="#FFFFFF" height="131.7656" rx="9" ry="9" style="stroke:#4F5BD5;stroke-width:0.75;" width="276.2578" x="1446" y="638.6719"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="131.4229" x="1464" y="676.0957">Local LLM server</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="218.6279" x="1464" y="700.0371">[external, on this computer]</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="240.2578" x="1464" y="723.9785">Ollama (127.0.0.1:11434) or an</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="208.8018" x="1464" y="747.9199">OpenAI-compatible server</text></g><!--entity Remote--><g id="elem_Remote"><rect fill="#FFFFFF" height="131.7656" rx="9" ry="9" style="stroke:#4F5BD5;stroke-width:0.75;" width="336.2344" x="1774.5" y="638.6719"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="255.7529" x="1792.5" y="676.0957">Remote LLM / transcription APIs</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="148.6846" x="1792.5" y="700.0371">[external, optional]</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="300.2344" x="1792.5" y="723.9785">OpenAI, Anthropic (only when chosen</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="161.9912" x="1792.5" y="747.9199">and local_only is off)</text></g><!--entity Gemini--><g id="elem_Gemini"><rect fill="#FFFFFF" height="131.7656" rx="9" ry="9" style="stroke:#4F5BD5;stroke-width:0.75;" width="256.1221" x="2163.75" y="638.6719"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="118.916" x="2181.75" y="676.0957">Google Gemini</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="148.6846" x="2181.75" y="700.0371">[external, optional]</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="220.1221" x="2181.75" y="723.9785">only in the interview room's</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="181.3975" x="2181.75" y="747.9199">online follow-up mode</text></g><!--entity Stun--><g id="elem_Stun"><rect fill="#FFFFFF" height="131.7656" rx="9" ry="9" style="stroke:#4F5BD5;stroke-width:0.75;" width="286.5938" x="552.75" y="638.6719"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="107.5693" x="570.75" y="676.0957">Google STUN</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="74.0127" x="570.75" y="700.0371">[external]</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="227.3291" x="570.75" y="723.9785">finds a network route for the</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="250.5938" x="570.75" y="747.9199">room's video (no media passes)</text></g><g id="elem_GMN22"><path d="M892.5,664.1719 L892.5,744.9961 A6,6 0 0 0 898.5,750.9961 L1387.1045,750.9961 A6,6 0 0 0 1393.1045,744.9961 L1393.1045,673.1719 L1378.1045,658.1719 L898.5,658.1719 A6,6 0 0 0 892.5,664.1719 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:0.75;"/><path d="M1378.1045,658.1719 L1378.1045,670.1719 A3,3 0 0 0 1381.1045,673.1719 L1393.1045,673.1719 L1378.1045,658.1719 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:1.5;"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="362.1357" x="904.5" y="688.0957">Nothing is sent to a project server: there is no</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="398.5225" x="904.5" y="712.0371">telemetry. Remote providers receive only what the</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="463.1045" x="904.5" y="735.9785">user's chosen provider needs, and local_only refuses them.</text></g><!--link Cand to Meet--><g id="link_Cand_Meet"><path d="M171.36,222.2119 C190.14,330.2419 224.0727,525.375 242.1927,629.55 " fill="none" id="Cand-to-Meet" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="243.735,638.4169,247.3328,624.0884,242.4498,631.0278,235.5103,626.1448,243.735,638.4169" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="94.4238" x="223.5" y="437.4771">takes the call</text></g><!--link Iv to Meet--><g id="link_Iv_Meet"><path d="M600.045,222.2119 C522.54,330.2419 381.431,526.9289 306.701,631.1039 " fill="none" id="Iv-to-Meet" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="301.455,638.4169,314.1993,630.9447,305.8266,632.3227,304.4486,623.9501,301.455,638.4169" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="124.1206" x="498" y="437.4771">runs the meeting</text></g><!--link Cand to OM--><g id="link_Cand_OM"><path d="M232.11,221.9569 C272.115,256.6819 324.36,295.9219 378,319.1719 C399.51,328.5019 646.5312,367.9084 833.9862,396.9634 " fill="none" id="Cand-to-OM" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="842.88,398.3419,830.4583,390.3449,835.4685,397.1931,828.6203,402.2033,842.88,398.3419" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="225.5376" x="382.5" y="300.2271">sees suggestions in the overlay</text></g><!--link Iv to OM--><g id="link_Iv_OM"><path d="M815.535,220.5919 C841.26,234.3169 866.82,249.7669 889.5,266.6719 C914.85,285.5719 915.975,296.0119 937.5,319.1719 C951.03,333.7369 959.4773,342.7469 973.3523,357.4469 " fill="none" id="Iv-to-OM" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="979.53,363.9919,974.6268,350.056,974.382,358.5377,965.9002,358.2929,979.53,363.9919" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="248.6924" x="942" y="300.2271">sees follow-ups and integrity flags</text></g><!--link Iv to OM--><g id="link_Iv_OM"><path d="M626.73,221.9419 C620.16,254.5669 619.755,291.9919 640.5,319.1719 C666.585,353.3419 746.4531,377.5964 833.7531,395.7314 " fill="none" id="Iv-to-OM-1" style="stroke:#3E4756;stroke-width:1.5;stroke-dasharray:7.0,7.0;"/><polygon fill="#3E4756" points="842.565,397.5619,830.5675,388.9415,835.2218,396.0365,828.1268,400.6907,842.565,397.5619" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="228.4944" x="645" y="288.9771">hosts a browser interview room</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="226.3674" x="646.0635" y="310.9233">(room_server.py, local network)</text></g><!--link Wp to OM--><g id="link_Wp_OM"><path d="M1250.745,221.9719 C1241.91,254.0419 1227.87,290.9869 1206,319.1719 C1193.04,335.8819 1183.9319,345.4033 1166.7119,358.5583 " fill="none" id="Wp-to-OM" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="1159.56,364.0219,1173.9302,360.5944,1165.5199,359.4689,1166.6454,351.0586,1159.56,364.0219" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="303.0103" x="1239" y="300.2271">sees the live board, catch-up and minutes</text></g><!--link OM to Meet--><g id="link_OM_Meet"><path d="M842.94,447.7219 C748.53,462.1369 636.96,489.4519 547.5,541.1719 C520.125,556.9969 525.135,575.1619 499.5,593.6719 C476.31,610.4269 458.2026,621.4225 431.8476,634.5775 " fill="none" id="OM-to-Meet" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="423.795,638.5969,438.5535,637.9361,430.5055,635.2474,433.1943,627.1993,423.795,638.5969" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="194.5518" x="611.9938" y="563.4771">captures system audio and</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="314.5393" x="552" y="585.4233">screen (Windows loopback, screen capture)</text></g><!--link OM to OLLAMA--><g id="link_OM_OLLAMA"><path d="M1170.375,496.3519 C1256.325,539.3269 1360.6846,591.5231 1446.6346,634.4831 " fill="none" id="OM-to-OLLAMA" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="1454.685,638.5069,1445.2919,627.1042,1447.9763,635.1537,1439.9269,637.8381,1454.685,638.5069" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="185.7458" x="1365" y="574.7271">suggestions, embeddings</text></g><!--link OM to Remote--><g id="link_OM_Remote"><path d="M1239.12,463.2769 C1338.465,481.5769 1459.905,507.6619 1566,541.1719 C1649.295,567.4819 1731.0916,602.0392 1802.1916,634.8142 " fill="none" id="OM-to-Remote" style="stroke:#3E4756;stroke-width:1.5;stroke-dasharray:7.0,7.0;"/><polygon fill="#3E4756" points="1810.365,638.5819,1800.6167,627.4814,1803.5538,635.4421,1795.5931,638.3793,1810.365,638.5819" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="192.6746" x="1707" y="563.4771">suggestions (if configured;</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="166.571" x="1720.0518" y="585.4233">keys in the OS keyring)</text></g><!--link OM to Gemini--><g id="link_OM_Gemini"><path d="M1239,440.5519 C1418.28,452.3269 1688.31,479.4019 1915.5,541.1719 C2002.02,564.6919 2086.4608,600.4343 2158.1458,634.6043 " fill="none" id="OM-to-Gemini" style="stroke:#3E4756;stroke-width:1.5;stroke-dasharray:7.0,7.0;"/><polygon fill="#3E4756" points="2166.27,638.4769,2156.6654,627.2519,2159.4998,635.2497,2151.5019,638.0842,2166.27,638.4769" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="227.0442" x="2068.5" y="574.7271">room follow-ups (online mode)</text></g><!--link OM to Stun--><g id="link_OM_Stun"><path d="M974.115,496.5469 C959.445,511.0969 944.085,526.5469 930,541.1719 C908.07,563.9419 906.555,573.7669 882,593.6719 C862.35,609.6019 847.7865,619.9983 825.7215,633.6633 " fill="none" id="OM-to-Stun" style="stroke:#3E4756;stroke-width:1.5;stroke-dasharray:7.0,7.0;"/><polygon fill="#3E4756" points="818.07,638.4019,832.7063,636.3949,824.4462,634.453,826.3882,626.1929,818.07,638.4019" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="160.1177" x="934.5" y="574.7271">room connection only</text></g><!--link OM to GMN22--><g id="link_OM_GMN22"><path d="M1087.005,496.2019 C1095.66,510.4969 1103.895,525.9469 1110,541.1719 C1125.18,579.0019 1133.67,624.7069 1138.23,657.9169 " fill="none" id="OM-GMN22" style="stroke:#3E4756;stroke-width:1.5;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[TLPTRzis57tNhxXB7c83ihoqQOkvm03dgp1WDqNI8i3cmQ0boc4jaG99sJE6_VSTKfHiTMdoOfEyzroUUywbVn4oBUgCKvACLyOU2fw8kYoY2xgveeBlU46ND307Otb9gPAM_ss7CMMQxINjXNsXgc12qfU2IVjjCQU1LAHvgIodaDh4P1G9YsMPSMr8vNaX91ycGBdbMknuHhbM9JtUJMyNTqcPqK3jk2xO8QQKoKnapF8O-IpNEy7tN1DMQQ_q5kWffr9vc4Abh1ZbGXiR4-gmlE0bj_emZ05b