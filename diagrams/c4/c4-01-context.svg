<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="778.5px" preserveAspectRatio="none" style="width:2659px;height:778px;background:#FFFFFF;" version="1.1" viewBox="0 0 2659 778" width="2659.5px" zoomAndPan="magnify"><title>C4 level 1: OpenMeet system context</title><defs/><g><text fill="#000000" font-family="Segoe UI" font-size="24" font-weight="bold" lengthAdjust="spacing" textLength="417.6445" x="1110.5552" y="43.8984">C4 level 1: OpenMeet system context</text><!--entity Cand--><g id="elem_Cand"><ellipse cx="2509.6274" cy="90.4219" fill="#FFFFFF" rx="12" ry="12" style="stroke:#3E4756;stroke-width:0.75;"/><path d="M2509.6274,102.4219 L2509.6274,142.9219 M2490.1274,114.4219 L2529.1274,114.4219 M2509.6274,142.9219 L2490.1274,165.4219 M2509.6274,142.9219 L2529.1274,165.4219 " fill="none" style="stroke:#3E4756;stroke-width:0.75;"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="80.7188" x="2370" y="190.0957">Candidate</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="279.2549" x="2370" y="214.0371">(answers; uses the desktop overlay)</text></g><!--entity Iv--><g id="elem_Iv"><ellipse cx="1852.6216" cy="90.4219" fill="#FFFFFF" rx="12" ry="12" style="stroke:#3E4756;stroke-width:0.75;"/><path d="M1852.6216,102.4219 L1852.6216,142.9219 M1833.1216,114.4219 L1872.1216,114.4219 M1852.6216,142.9219 L1833.1216,165.4219 M1852.6216,142.9219 L1872.1216,165.4219 " fill="none" style="stroke:#3E4756;stroke-width:0.75;"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="87.8203" x="1691.25" y="190.0957">Interviewer</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="322.7432" x="1691.25" y="214.0371">(asks; uses the desktop app or the room)</text></g><!--entity OM--><g id="elem_OM"><rect fill="#E6E9FB" height="131.7656" rx="9" ry="9" style="stroke:#4F5BD5;stroke-width:0.75;" width="396.2549" x="1357.5" y="364.1719"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="84.8408" x="1375.5" y="401.5957">OpenMeet</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="138.5508" x="1375.5" y="425.5371">[software system]</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="321.0645" x="1375.5" y="449.4785">Local-first meeting copilot: transcription,</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="360.2549" x="1375.5" y="473.4199">suggestions, follow-ups, answer-integrity flag</text></g><!--entity Meet--><g id="elem_Meet"><rect fill="#FFFFFF" height="131.7656" rx="9" ry="9" style="stroke:#4F5BD5;stroke-width:0.75;" width="488.6982" x="2044.5" y="638.6719"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="101.4873" x="2062.5" y="676.0957">Meeting app</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="74.0127" x="2062.5" y="700.0371">[external]</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="354.4893" x="2062.5" y="723.9785">Zoom, Teams, Google Meet, Slack, Discord ...</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="452.6982" x="2062.5" y="747.9199">(audio and screen are read locally, never sent by the app)</text></g><!--entity OLLAMA--><g id="elem_OLLAMA"><rect fill="#FFFFFF" height="131.7656" rx="9" ry="9" style="stroke:#4F5BD5;stroke-width:0.75;" width="276.2578" x="562.5" y="638.6719"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="131.4229" x="580.5" y="676.0957">Local LLM server</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="218.6279" x="580.5" y="700.0371">[external, on this computer]</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="240.2578" x="580.5" y="723.9785">Ollama (127.0.0.1:11434) or an</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="208.8018" x="580.5" y="747.9199">OpenAI-compatible server</text></g><!--entity Remote--><g id="elem_Remote"><rect fill="#FFFFFF" height="131.7656" rx="9" ry="9" style="stroke:#4F5BD5;stroke-width:0.75;" width="336.2344" x="891" y="638.6719"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="255.7529" x="909" y="676.0957">Remote LLM / transcription APIs</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="148.6846" x="909" y="700.0371">[external, optional]</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="300.2344" x="909" y="723.9785">OpenAI, Anthropic (only when chosen</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="161.9912" x="909" y="747.9199">and local_only is off)</text></g><!--entity Gemini--><g id="elem_Gemini"><rect fill="#FFFFFF" height="131.7656" rx="9" ry="9" style="stroke:#4F5BD5;stroke-width:0.75;" width="256.1221" x="1280.25" y="638.6719"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="118.916" x="1298.25" y="676.0957">Google Gemini</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="148.6846" x="1298.25" y="700.0371">[external, optional]</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="220.1221" x="1298.25" y="723.9785">only in the interview room's</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="181.3975" x="1298.25" y="747.9199">online follow-up mode</text></g><!--entity Stun--><g id="elem_Stun"><rect fill="#FFFFFF" height="131.7656" rx="9" ry="9" style="stroke:#4F5BD5;stroke-width:0.75;" width="286.5938" x="1589.25" y="638.6719"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="107.5693" x="1607.25" y="676.0957">Google STUN</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="74.0127" x="1607.25" y="700.0371">[external]</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="227.3291" x="1607.25" y="723.9785">finds a network route for the</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="250.5938" x="1607.25" y="747.9199">room's video (no media passes)</text></g><g id="elem_GMN20"><path d="M9,664.1719 L9,744.9961 A6,6 0 0 0 15,750.9961 L503.6045,750.9961 A6,6 0 0 0 509.6045,744.9961 L509.6045,673.1719 L494.6045,658.1719 L15,658.1719 A6,6 0 0 0 9,664.1719 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:0.75;"/><path d="M494.6045,658.1719 L494.6045,670.1719 A3,3 0 0 0 497.6045,673.1719 L509.6045,673.1719 L494.6045,658.1719 " fill="#FFF8E1" style="stroke:#C9A227;stroke-width:1.5;"/><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="362.1357" x="21" y="688.0957">Nothing is sent to a project server: there is no</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="398.5225" x="21" y="712.0371">telemetry. Remote providers receive only what the</text><text fill="#000000" font-family="Segoe UI" font-size="18" lengthAdjust="spacing" textLength="463.1045" x="21" y="735.9785">user's chosen provider needs, and local_only refuses them.</text></g><!--link Cand to Meet--><g id="link_Cand_Meet"><path d="M2497.23,222.0769 C2491.77,252.1219 2485.005,287.4469 2478,319.1719 C2460.51,398.4319 2466.72,422.3419 2433,496.1719 C2409.63,547.3369 2378.9446,592.1804 2348.7046,631.2404 " fill="none" id="Cand-to-Meet" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="2343.195,638.3569,2356.2037,631.3551,2347.7863,632.4264,2346.715,624.0091,2343.195,638.3569" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="94.4238" x="2473.5" y="437.4771">takes the call</text></g><!--link Iv to Meet--><g id="link_Iv_Meet"><path d="M2016.915,214.2319 C2043.945,228.9469 2070.33,246.3769 2092.5,266.6719 C2197.26,362.5369 2204.775,408.7369 2256,541.1719 C2267.955,572.0869 2274.359,599.2104 2279.414,629.4054 " fill="none" id="Iv-to-Meet" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="2280.9,638.2819,2284.5886,623.9765,2279.6616,630.8848,2272.7533,625.9579,2280.9,638.2819" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="124.1206" x="2241" y="437.4771">runs the meeting</text></g><!--link Cand to OM--><g id="link_Cand_OM"><path d="M2366.595,216.2569 C2287.14,250.5319 2185.74,291.1369 2092.5,319.1719 C1982.25,352.3219 1865.1062,376.9996 1762.8812,395.4946 " fill="none" id="Cand-to-OM" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="1754.025,397.0969,1768.3775,400.5976,1761.4052,395.7616,1766.2411,388.7893,1754.025,397.0969" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="225.5376" x="2236.5" y="300.2271">sees suggestions in the overlay</text></g><!--link Iv to OM--><g id="link_Iv_OM"><path d="M1841.085,221.9119 C1832.73,254.7169 1818.405,292.3219 1794,319.1719 C1778.22,336.5419 1766.8053,346.6306 1746.3753,359.2006 " fill="none" id="Iv-to-OM" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="1738.71,363.9169,1753.3521,361.9527,1745.0978,359.9867,1747.0638,351.7323,1738.71,363.9169" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="248.6924" x="1828.5" y="300.2271">sees follow-ups and integrity flags</text></g><!--link Iv to OM--><g id="link_Iv_OM"><path d="M1688.1,174.4819 C1633.395,190.9369 1578.045,218.9719 1545,266.6719 C1525.665,294.5869 1525.003,323.3084 1531.693,355.2134 " fill="none" id="Iv-to-OM-1" style="stroke:#3E4756;stroke-width:1.5;stroke-dasharray:7.0,7.0;"/><polygon fill="#3E4756" points="1533.54,364.0219,1536.6418,349.5779,1532.0008,356.6815,1524.8972,352.0405,1533.54,364.0219" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="228.4944" x="1549.5" y="288.9771">hosts a browser interview room</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="226.3674" x="1550.5635" y="310.9233">(room_server.py, local network)</text></g><!--link OM to Meet--><g id="link_OM_Meet"><path d="M1753.74,494.2819 C1788.93,508.0069 1824.645,523.7419 1857,541.1719 C1891.395,559.6969 1892.625,576.0769 1927.5,593.6719 C1964.1,612.1219 1995.8549,625.1972 2035.8299,638.8022 " fill="none" id="OM-to-Meet" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="2044.35,641.7019,2033.503,631.6723,2037.2499,639.2855,2029.6367,643.0324,2044.35,641.7019" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="194.5518" x="1991.9938" y="563.4771">captures system audio and</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="314.5393" x="1932" y="585.4233">screen (Windows loopback, screen capture)</text></g><!--link OM to OLLAMA--><g id="link_OM_OLLAMA"><path d="M1357.32,442.3369 C1228.725,454.8769 1059.87,482.0869 921,541.1719 C865.92,564.6019 818.5569,598.4468 777.6369,632.6318 " fill="none" id="OM-to-OLLAMA" style="stroke:#3E4756;stroke-width:1.5;"/><polygon fill="#3E4756" points="770.73,638.4019,784.9371,634.3513,776.4858,633.5934,777.2436,625.1421,770.73,638.4019" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="185.7458" x="925.5" y="574.7271">suggestions, embeddings</text></g><!--link OM to Remote--><g id="link_OM_Remote"><path d="M1357.155,463.2319 C1295.745,479.5369 1230.405,504.1519 1177.5,541.1719 C1141.95,566.0419 1117.639,597.3568 1097.224,630.8518 " fill="none" id="OM-to-Remote" style="stroke:#3E4756;stroke-width:1.5;stroke-dasharray:7.0,7.0;"/><polygon fill="#3E4756" points="1092.54,638.5369,1104.6894,630.1319,1096.4433,632.1327,1094.4426,623.8866,1092.54,638.5369" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="192.6746" x="1182" y="563.4771">suggestions (if configured;</text><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="166.571" x="1195.0518" y="585.4233">keys in the OS keyring)</text></g><!--link OM to Gemini--><g id="link_OM_Gemini"><path d="M1439.175,496.7719 C1425.03,509.6269 1412.565,524.4169 1404,541.1719 C1388.895,570.7369 1387.4794,598.536 1391.6194,629.556 " fill="none" id="OM-to-Gemini" style="stroke:#3E4756;stroke-width:1.5;stroke-dasharray:7.0,7.0;"/><polygon fill="#3E4756" points="1392.81,638.4769,1396.9714,624.3018,1391.8178,631.0428,1385.0768,625.8893,1392.81,638.4769" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="227.0442" x="1408.5" y="574.7271">room follow-ups (online mode)</text></g><!--link OM to Stun--><g id="link_OM_Stun"><path d="M1612.395,496.6669 C1623.885,510.9319 1635.495,526.2469 1645.5,541.1719 C1666.11,571.9369 1681.8186,600.0706 1697.2986,630.4006 " fill="none" id="OM-to-Stun" style="stroke:#3E4756;stroke-width:1.5;stroke-dasharray:7.0,7.0;"/><polygon fill="#3E4756" points="1701.39,638.4169,1700.5971,623.6649,1697.9805,631.7367,1689.9087,629.1201,1701.39,638.4169" style="stroke:#3E4756;stroke-width:1.5;"/><text fill="#3E4756" font-family="Segoe UI" font-size="16.5" lengthAdjust="spacing" textLength="160.1177" x="1681.5" y="574.7271">room connection only</text></g><!--link OM to GMN20--><g id="link_OM_GMN20"><path d="M1357.26,453.8119 C1208.25,472.2319 999.615,501.7819 819,541.1719 C672.765,573.0619 508.62,622.2169 396.135,658.0219 " fill="none" id="OM-GMN20" style="stroke:#3E4756;stroke-width:1.5;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[TLPTZnet57sVNt6x-x0W3KD9DebAf4hi1n4IPAFTH9LQAcHcFE0mOuzi3nHL_UyzzfY1QJUxB-3h-tNkETVy96HQr1cd91ckZ3qMF15rMKGtT7zB1T_pWaRKCqTZUKcfafR_PVinPPeT91s4tL9LC27fIy6a_RQOKqygqhnKbbC8RM8oYeJ5iSouDgJol12IznDaUU1Qx7b6kLObFJzE7XQFIPbHJ-svBjWnffJ9J6GCuV018ItNUy4FN5EfVEn2fQmOv48R6nEIMrxmabjzxCU8RtGwiApMOeXFGtztnKI2Adf6P3nbcao5Nb22DnPmerGZdncgYikISpkejDeBLxeFahFKAdrqCL0ISg3phLQLIDtHa9nRamAVYuALpASBeBWkV2QQpnVKHkwV6c5Yg9KgXwkLaCAkLabr36dSySgWVQxTOQ_5mbl8MmAGTiileRen65rPrJZuNvuS9Qf3NPbkekGxIlwarARWz8cNg0K1IKatE8zyJC7wylNRPygLfjdz8w9t0JSyrTmQ3y3J2-tuKGkvmUIjiF0zSsnCJu1j0RIfIxOeCZiXAwPP2GAbbacNzE-8w8wbkurMjSpkLO7yrzFtqm_J1sTH6fY6qzlfkxk7TpXzRgvg2UwCtaJ_H94V95tTdoYsb3qc3G0p7wast7WSGRATLHK5HlQlY1boBYVtsHbe5y3iNlDc5I9eV-JWRQBCzb5qxkdgXC1I_c5KRWzCym36dqivFzES72a18o2gHA7icAn6tQaMbHLAnajfwis66_S50cacFC28OshQ6pXkRBImHyeBjl6rF2te-l7zuo_JkqvDYv0AzQCip8DhoGhKypkwYEahPwLfgU0kn_HIO30nFGYJOWvOB8c3fSw4ykH7dPnBSirfpbhPGRjW0jJ8fQNrqIE5f0rGdXVNK_ztMTsy5LAZYuiIOv0LGSIP-YZwoSkHUgCt7vAVyJyQZqQtRs_xRZHCmeu9J6O3vy6iM2D54xT1Q3wVB2QlbV7SIDlLCUpEWYPVPgPRbJ_t43RPOfgSzWVMdYoETDW2dtIh0CLIjljYvMt2hyy6bP3sbO8wmlrH-YQUx2uBpyuRuwrEwYrvlEXzsh0EVfpMROGkMN8XCsnBZDWUbDuX2GRYbmQIBsMJazmcLFu1ANac65NCG4PDho-sbctAoCcF1eDV6sA0_smNzEQu5CtsbqPToyOMP7Fs1kV7c31SBmHpWYJe_HJiVFUif_P9Ecl9kFj94kvZXjRrlTRg02Rz1sR8ehlJmsu-mTIF4EIYaPHLjjQkscP3jffQoY2gtcy06gaGHrLhByDW2Rvjo43cCNLM1I_NFCk0aN7tN1k1OvrxU7f