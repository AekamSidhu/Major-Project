<text xml:space="preserve" text-anchor="start" x="406.65" y="-90.99" font-family="Segoe UI" font-weight="bold" font-size="11.00" fill="#1f2430">Reading the diagram</text>
<text xml:space="preserve" text-anchor="start" x="394.65" y="-79.99" font-family="Segoe UI" font-size="11.00" fill="#1f2430"> &#160;&#160;&#160;Every entity here is also owned by meetings (see er&#45;02); its key is id.</text>
<text xml:space="preserve" text-anchor="start" x="394.65" y="-68.99" font-family="Segoe UI" font-size="11.00" fill="#1f2430"> &#160;&#160;&#160;These links are plain TEXT columns, not FOREIGN KEYs: SQLite neither checks</text>
<text xml:space="preserve" text-anchor="start" x="394.65" y="-57.99" font-family="Segoe UI" font-size="11.00" fill="#1f2430"> &#160;&#160;&#160;nor cascades them; load_meeting returns the rows and Rust code resolves the ids.</text>
<text xml:space="preserve" text-anchor="start" x="394.65" y="-46.99" font-family="Segoe UI" font-size="11.00" fill="#1f2430"> &#160;&#160;&#160;segment_ids is a JSON array column (questions, answers), hence M:N.</text>
<text xml:space="preserve" text-anchor="start" x="394.65" y="-35.99" font-family="Segoe UI" font-size="11.00" fill="#1f2430"> &#160;&#160;&#160;question_id, supersedes, parent_id, segment_id, source_segment_id are nullable (0..1).</text>
<text xml:space="preserve" text-anchor="start" x="394.65" y="-24.99" font-family="Segoe UI" font-size="11.00" fill="#1f2430"> &#160;&#160;&#160;embeddings.item_id + kind name the item a vector belongs to (no row&#45;id reference). screen_observations, topics, participants and</text>
<text xml:space="preserve" text-anchor="start" x="394.65" y="-13.99" font-family="Segoe UI" font-size="11.00" fill="#1f2430"> &#160;&#160;&#160;meeting_summaries hold no row&#45;id references (summary lists are JSON arrays of strings).</text>
<text xml:space="preserve" text-anchor="start" x="716.4" y="-2.99" font-family="Segoe UI" font-size="11.00" fill="#1f2430"> &#160;</text>
