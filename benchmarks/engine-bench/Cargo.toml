[package]
name = "openmeet-engine-bench"
description = "Headless runner for the OpenMeet engine's benchmark and a live pipeline timing (benchmarks only)"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

# A workspace of its own: the benchmarks never change the product workspace.
[workspace]

[dependencies]
openmeet-core = { path = "../../crates/openmeet-core" }
openmeet-engine = { path = "../../crates/openmeet-engine" }
openmeet-providers = { path = "../../crates/openmeet-providers" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = "1.0"
parking_lot = "0.12"

# Optimised like an installed app (the app's release profile adds thin LTO and
# one codegen unit, which only makes it faster).
[profile.release]
opt-level = 3
